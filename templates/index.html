<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <title>GitLocal-Go IDE 工作區</title>
    <script>
        const savedTheme = localStorage.getItem('gitlocal_theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body { height: 100vh; overflow: hidden !important; margin: 0; }
        body.container-fluid { display: flex; flex-direction: column; height: 100vh; padding: 1rem; }
        
        /* 🌟 IDE 雙欄外框 */
        #ide-wrapper { flex: 1; display: flex; min-height: 0; gap: 1rem; }
        
        /* 🌟 左側側邊欄：列高精簡優化 (維持文字大小，縮減 padding/margin) */
        #sidebar { width: 280px; flex-shrink: 0; display: flex; flex-direction: column; border-radius: 6px; border: 1px solid var(--bs-border-color); background: var(--bs-tertiary-bg); overflow: hidden; }
        #sidebar-header { padding: 8px 12px; font-weight: bold; background: var(--bs-secondary-bg); border-bottom: 1px solid var(--bs-border-color); display: flex; justify-content: space-between; align-items: center; }
        #repo-tree-root { flex: 1; overflow-y: auto; padding: 6px; font-size: 0.95rem; }
        
        .repo-item { border: 1px solid var(--bs-border-color); border-radius: 6px; margin-bottom: 4px; background: var(--bs-body-bg); overflow: hidden; }
        .repo-header { padding: 5px 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: space-between; user-select: none; transition: background-color 0.15s; }
        .repo-header:hover { background-color: rgba(13, 110, 253, 0.08); }
        .repo-header.active { background-color: rgba(13, 110, 253, 0.15); color: #0d6efd; border-left: 3px solid #0d6efd; }
        
        .file-list { padding: 2px 0 4px 0; border-top: 1px solid var(--bs-border-color); display: none; background: var(--bs-tertiary-bg); }
        .file-list.show { display: block; }
        
        /* GitHub 風格樹狀資料夾與檔案 (列高高度精簡) */
        .tree-folder-title { padding: 2px 6px; font-weight: 600; cursor: pointer; user-select: none; border-radius: 4px; font-size: 0.9rem; color: var(--bs-body-color); display: flex; align-items: center; }
        .tree-folder-title:hover { background-color: rgba(13, 110, 253, 0.08); }
        .folder-arrow { font-size: 0.75rem; width: 14px; display: inline-block; color: #888; transition: transform 0.1s; }
        
        .file-tree-item { display: block; padding: 2px 6px; border-radius: 4px; color: var(--bs-body-color); text-decoration: none; word-break: break-all; transition: background-color 0.1s; font-size: 0.88rem; }
        .file-tree-item:hover { background-color: rgba(13, 110, 253, 0.1); text-decoration: none; color: #0d6efd; }
        .file-tree-item.active { background-color: rgba(13, 110, 253, 0.15); font-weight: bold; color: #0d6efd; border-left: 3px solid #0d6efd; }

        /* 右側主工作區 */
        #main-workspace { flex: 1; display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--bs-border-color); border-radius: 6px; background: var(--bs-body-bg); overflow: hidden; }
        
        /* 🌟 匯入專案拖曳與瀏覽感應區樣式 (高度精簡版) */
        .import-drop-zone {
            border: 2px dashed var(--bs-border-color);
            border-radius: 0.5rem;
            padding: 0.6rem 0.8rem;
            text-align: center;
            background-color: var(--bs-tertiary-bg);
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .import-drop-zone:hover, .import-drop-zone.dragover {
            border-color: #198754 !important;
            background-color: var(--bs-secondary-bg);
            transform: scale(1.01);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bs-secondary-bg); }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <!-- 🌟 首頁標題連結 -->
        <div class="d-flex align-items-center gap-2">
            <a href="/" class="brand-link text-decoration-none text-body" title="點擊返回首頁">
                <h3 class="mb-0 fw-bold">⚡ GitLocal-Go IDE 工作區</h3>
            </a>
        </div>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary fw-bold px-3 shadow-sm" onclick="toggleTheme()" title="切換深淺模式">
                <span id="theme-icon">🌙</span>
            </button>
        </div>
    </div>

    <div id="ide-wrapper">
        <div id="sidebar" class="shadow-sm">
            <div id="sidebar-header">
                <span>🗂️ 本地倉庫</span>
                <span class="badge bg-primary rounded-pill" id="repo-count">0</span>
            </div>
            <div id="repo-tree-root"></div>
        </div>

        <div id="main-workspace" class="shadow-sm">
            <div id="workspace-content" class="w-100 h-100 overflow-auto p-3">
                
                <!-- 主頁面歡迎區塊 (間距縮減) -->
                <div class="text-center py-2 mb-2">
                    <h2 class="fw-bold mb-1">👋 歡迎使用 GitLocal-Go IDE 工作區</h2>
                    <p class="text-secondary fs-5 mb-0">請在左側選擇一個倉庫，或在此建立／匯入專案展開開發。</p>
                </div>

                <!-- 兩大功能卡片併排 (高度與內部列高優化) -->
                <div class="row g-3 justify-content-center max-w-4xl mx-auto" style="max-width: 920px;">
                    
                    <!-- 卡片 1：建立新專案 -->
                    <div class="col-12 col-md-5">
                        <div class="card shadow-sm border-0 bg-tertiary h-100">
                            <div class="card-header bg-primary bg-opacity-10 border-0 py-2 px-3">
                                <h5 class="card-title fw-bold text-primary mb-0">✨ 建立全新 Git 倉庫</h5>
                            </div>
                            <div class="card-body p-3 d-flex flex-column justify-content-between">
                                <p class="text-muted small mb-2">適合從零開始的新專案。系統將自動建立 `.git` 金庫基礎架構與初始化設定。</p>
                                <form action="/create_repo" method="POST">
                                    <div class="mb-2">
                                        <label class="form-label fw-bold mb-1">專案名稱</label>
                                        <input type="text" name="repo_name" class="form-control fs-6" placeholder="例如: my_new_app" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100 fw-bold fs-6 py-2 mt-2 shadow-sm">🚀 建立空白專案</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- 卡片 2：匯入專案 -->
                    <div class="col-12 col-md-7">
                        <div class="card shadow-sm border-0 bg-tertiary h-100">
                            <div class="card-header bg-success bg-opacity-10 border-0 py-2 px-3">
                                <h5 class="card-title fw-bold text-success mb-0">📥 匯入專案 (ZIP 解壓即用)</h5>
                            </div>
                            <div class="card-body p-3">
                                <form action="/import_repo" method="POST" enctype="multipart/form-data" id="import-form">
                                    <div class="mb-2">
                                        <label class="form-label fw-bold mb-1">新專案名稱</label>
                                        <input type="text" id="import-repo-name" name="repo_name" class="form-control" placeholder="選擇或拖入 ZIP 後自動帶入，亦可自訂" required>
                                    </div>

                                    <!-- 感應區：高度適度縮減 -->
                                    <div class="mb-2">
                                        <label class="form-label fw-bold mb-1">選擇或拖曳 ZIP 檔案</label>
                                        <div class="import-drop-zone" id="import-drop-zone" onclick="triggerFileInput()">
                                            
                                            <!-- 預設視圖 -->
                                            <div id="drop-zone-prompt" class="d-flex flex-column align-items-center py-1">
                                                <span class="fs-3 text-success mb-1">📦</span>
                                                <div class="fw-bold text-body mb-1">將 ZIP 檔案拖曳至此，或是</div>
                                                <button type="button" class="btn btn-sm btn-outline-success fw-bold px-3 shadow-sm mb-1" onclick="event.stopPropagation(); triggerFileInput();">
                                                    📁 瀏覽並選擇檔案
                                                </button>
                                                <small class="text-muted" style="font-size:0.8rem;">支援 Full Backup 完整金庫包或普通純源碼 ZIP</small>
                                            </div>

                                            <!-- 選取檔案後的預覽視圖 -->
                                            <div id="file-selected-info" class="d-none py-1">
                                                <span class="fs-4">📄</span>
                                                <div id="selected-filename" class="fw-bold text-success fs-6 my-1"></div>
                                                <div id="selected-filesize" class="badge bg-secondary mb-1"></div>
                                                <div>
                                                    <button type="button" class="btn btn-sm btn-outline-danger px-3 py-1 fw-bold" onclick="event.stopPropagation(); clearSelectedZipIndex();">重新選擇 ✖</button>
                                                </div>
                                            </div>

                                        </div>
                                        <input type="file" id="zip_file_input" name="zip_file" class="d-none" accept=".zip" onchange="handleZipSelectIndex(this.files)">
                                    </div>

                                    <button type="submit" id="import-submit-btn" class="btn btn-success w-100 fw-bold fs-6 py-2 mt-2 shadow-sm" disabled>🚀 開始匯入專案</button>
                                </form>
                            </div>
                        </div>
                    </div>

                </div> <!-- row end -->

            </div>
        </div>
    </div>

    <script>
        const repos = [
            {{ range .repos }}
                "{{ . }}",
            {{ end }}
        ];

        document.getElementById('repo-count').innerText = repos.length;

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('gitlocal_theme', newTheme);
            document.getElementById('theme-icon').innerText = newTheme === 'dark' ? '🌞' : '🌙';
            
            const iframe = document.getElementById('repo-frame');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.document.documentElement.setAttribute('data-bs-theme', newTheme);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const currentTheme = document.documentElement.getAttribute('data-bs-theme');
            document.getElementById('theme-icon').innerText = currentTheme === 'dark' ? '🌞' : '🌙';
            renderRepoTree();

            const urlParams = new URLSearchParams(window.location.search);
            const targetRepo = urlParams.get('repo');
            if (targetRepo && repos.includes(targetRepo)) {
                toggleRepo(targetRepo);
            }

            // 初始化匯入專案的拖曳事件監聽
            initImportDropZone();
        });

        // 🌟 觸發電腦選擇檔案視窗
        function triggerFileInput() {
            document.getElementById('zip_file_input').click();
        }

        // 🌟 匯入專案拖曳事件處理
        function initImportDropZone() {
            const dropZone = document.getElementById('import-drop-zone');
            if (!dropZone) return;

            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    dropZone.classList.add('dragover');
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    dropZone.classList.remove('dragover');
                }, false);
            });

            dropZone.addEventListener('drop', (e) => {
                const files = e.dataTransfer.files;
                if (files && files.length > 0) {
                    document.getElementById('zip_file_input').files = files;
                    handleZipSelectIndex(files);
                }
            });
        }

        function handleZipSelectIndex(files) {
            if (!files || files.length === 0) return;
            const file = files[0];

            if (!file.name.toLowerCase().endsWith('.zip')) {
                alert('❌ 請選擇格式為 .zip 的檔案！');
                clearSelectedZipIndex();
                return;
            }

            const repoNameInput = document.getElementById('import-repo-name');
            if (!repoNameInput.value.trim()) {
                const baseName = file.name.replace(/\.zip$/i, '').replace(/_full_backup$/i, '');
                repoNameInput.value = baseName;
            }

            let sizeStr = (file.size / 1024 / 1024).toFixed(2) + ' MB';
            if (file.size < 1024 * 1024) {
                sizeStr = (file.size / 1024).toFixed(2) + ' KB';
            }

            document.getElementById('drop-zone-prompt').classList.add('d-none');
            document.getElementById('file-selected-info').classList.remove('d-none');
            document.getElementById('selected-filename').innerText = file.name;
            document.getElementById('selected-filesize').innerText = sizeStr;

            document.getElementById('import-submit-btn').disabled = false;
        }

        function clearSelectedZipIndex() {
            document.getElementById('zip_file_input').value = '';
            document.getElementById('drop-zone-prompt').classList.remove('d-none');
            document.getElementById('file-selected-info').classList.add('d-none');
            document.getElementById('import-submit-btn').disabled = true;
        }

        function renderRepoTree() {
            const container = document.getElementById('repo-tree-root');
            if (!repos || repos.length === 0) {
                container.innerHTML = '<div class="p-3 text-center text-muted">目前沒有任何 Git 倉庫。</div>';
                return;
            }

            let html = '';
            repos.forEach(repoName => {
                html += `
                    <div class="repo-item">
                        <div class="repo-header" id="header-${repoName}" onclick="toggleRepo('${repoName}')">
                            <span>📁 ${repoName}</span>
                            <span class="arrow-icon small text-muted">▶</span>
                        </div>
                        <div class="file-list" id="files-${repoName}">
                            <div class="p-2 text-muted small text-center loading-text">⏳ 讀取檔案架構中...</div>
                        </div>
                    </div>`;
            });
            container.innerHTML = html;
        }

        async function toggleRepo(repoName) {
            const targetFileList = document.getElementById(`files-${repoName}`);
            const targetHeader = document.getElementById(`header-${repoName}`);
            const arrow = targetHeader.querySelector('.arrow-icon');
            const isCurrentlyShow = targetFileList.classList.contains('show');

            if (isCurrentlyShow) {
                targetFileList.classList.remove('show');
                targetHeader.classList.remove('active');
                if (arrow) arrow.innerText = '▶';
                return;
            }

            document.querySelectorAll('.file-list').forEach(el => el.classList.remove('show'));
            document.querySelectorAll('.repo-header').forEach(el => {
                el.classList.remove('active');
                const a = el.querySelector('.arrow-icon');
                if (a) a.innerText = '▶';
            });

            targetFileList.classList.add('show');
            targetHeader.classList.add('active');
            if (arrow) arrow.innerText = '▼';

            showRepoView(repoName);

            if (!targetFileList.dataset.loaded) {
                try {
                    const response = await fetch(`/api/repo/${repoName}/manifest`);
                    const manifest = await response.json();
                    targetFileList.dataset.loaded = "true";
                    renderRepoFiles(repoName, manifest);
                } catch (err) {
                    targetFileList.innerHTML = '<div class="p-2 text-danger small">無法讀取檔案</div>';
                }
            }
        }

        function buildFileTree(paths) {
            const root = { name: '', type: 'folder', children: {} };
            paths.forEach(path => {
                const parts = path.split('/');
                let current = root;
                parts.forEach((part, index) => {
                    const isFile = (index === parts.length - 1);
                    if (!current.children[part]) {
                        current.children[part] = {
                            name: part,
                            fullPath: parts.slice(0, index + 1).join('/'),
                            type: isFile ? 'file' : 'folder',
                            children: isFile ? null : {}
                        };
                    }
                    if (!isFile) {
                        current = current.children[part];
                    }
                });
            });
            return root;
        }

        function renderTreeHTML(node, repoName, level = 0) {
            let html = '';
            const childrenKeys = Object.keys(node.children || {}).sort((a, b) => {
                const aIsFolder = node.children[a].type === 'folder';
                const bIsFolder = node.children[b].type === 'folder';
                if (aIsFolder && !bIsFolder) return -1;
                if (!aIsFolder && bIsFolder) return 1;
                return a.localeCompare(b);
            });

            childrenKeys.forEach(key => {
                const child = node.children[key];
                const indent = level * 12 + 6;
                if (child.type === 'folder') {
                    const folderId = `dir-${repoName}-${child.fullPath.replace(/[^a-zA-Z0-9]/g, '_')}`;
                    html += `
                        <div class="tree-folder-group">
                            <div class="tree-folder-title" onclick="toggleFolderNode('${folderId}')" style="padding-left: ${indent}px">
                                <span class="folder-arrow" id="arrow-${folderId}">▼</span>
                                <span class="ms-1">📁 ${child.name}</span>
                            </div>
                            <div class="tree-folder-children" id="${folderId}">
                                ${renderTreeHTML(child, repoName, level + 1)}
                            </div>
                        </div>`;
                } else {
                    const ext = child.name.split('.').pop().toLowerCase();
                    const isImage = ['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp'].includes(ext);
                    const icon = isImage ? '🖼️' : '📄';

                    html += `<a href="javascript:void(0);" onclick="openFileInWorkspace('${repoName}', '${child.fullPath}', this)" class="file-tree-item" style="padding-left: ${indent + 14}px" title="${child.fullPath}">${icon} ${child.name}</a>`;
                }
            });
            return html;
        }

        window.openFileInWorkspace = function(repoName, filePath, el) {
            document.querySelectorAll('.file-tree-item').forEach(item => item.classList.remove('active'));
            if (el) el.classList.add('active');

            const workspace = document.getElementById('workspace-content');
            workspace.innerHTML = `
                <iframe id="repo-frame" src="/repo/${repoName}/file/${filePath}" style="width: 100%; height: 100%; border: none;"></iframe>
            `;
        };

        window.toggleFolderNode = function(folderId) {
            const el = document.getElementById(folderId);
            const arrow = document.getElementById(`arrow-${folderId}`);
            if (el) {
                if (el.style.display === 'none') {
                    el.style.display = 'block';
                    if (arrow) arrow.innerText = '▼';
                } else {
                    el.style.display = 'none';
                    if (arrow) arrow.innerText = '▶';
                }
            }
        };

        function renderRepoFiles(repoName, manifest) {
            const fileListEl = document.getElementById(`files-${repoName}`);
            const filePaths = Object.keys(manifest || {});

            if (filePaths.length === 0) {
                fileListEl.innerHTML = '<div class="p-2 text-muted small ms-2">倉庫內無任何檔案</div>';
                return;
            }

            const treeRoot = buildFileTree(filePaths);
            fileListEl.innerHTML = renderTreeHTML(treeRoot, repoName);
        }

        function showRepoView(repoName) {
            const workspace = document.getElementById('workspace-content');
            workspace.innerHTML = `
                <iframe id="repo-frame" src="/repo/${repoName}" style="width: 100%; height: 100%; border: none;"></iframe>
            `;
        }
    </script>
</body>
</html>
